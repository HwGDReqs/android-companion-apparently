name: Build Android app

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build unsigned APKs and App Bundles
        run: ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease

      - name: Stage unsigned APKs and App Bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned

          debug_apks=(app/build/outputs/apk/debug/*.apk)
          release_apks=(app/build/outputs/apk/release/*.apk)
          debug_bundles=(app/build/outputs/bundle/debug/*.aab)
          release_bundles=(app/build/outputs/bundle/release/*.aab)

          check_single_output() {
            local label="$1"
            shift
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected exactly one output for ${label}; Gradle output is missing or ambiguous."
              exit 1
            fi
          }
          check_single_output "debug APK" "${debug_apks[@]}"
          check_single_output "release APK" "${release_apks[@]}"
          check_single_output "debug App Bundle" "${debug_bundles[@]}"
          check_single_output "release App Bundle" "${release_bundles[@]}"

          cp "${debug_apks[0]}" unsigned/app-debug-unsigned.apk
          cp "${release_apks[0]}" unsigned/app-release-unsigned.apk
          cp "${debug_bundles[0]}" unsigned/app-debug-unsigned.aab
          cp "${release_bundles[0]}" unsigned/app-release-unsigned.aab

      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apps
          path: unsigned/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download unsigned build outputs
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apps
          path: unsigned/

      - name: Sign and verify APKs and App Bundles
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required signing secret ${secret_name} is missing. Configure all four signing secrets to produce signed artifacts."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::The decoded release keystore is empty or invalid."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::Unable to open the release keystore or find the configured key alias. Check the signing secrets."
            exit 1
          fi

          mkdir -p signed
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for variant in debug release; do
            apk="unsigned/app-${variant}-unsigned.apk"
            bundle="unsigned/app-${variant}-unsigned.aab"
            if [ ! -s "$apk" ] || [ ! -s "$bundle" ]; then
              echo "::error::Missing unsigned ${variant} APK or App Bundle."
              exit 1
            fi

            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "signed/app-${variant}.apk" \
              "$apk"
            "$apksigner" verify --verbose --print-certs "signed/app-${variant}.apk"

            jarsigner \
              -keystore "$keystore" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar "signed/app-${variant}.aab" \
              "$bundle" "$KEY_ALIAS"
            jarsigner -verify -verbose -certs "signed/app-${variant}.aab"
          done

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: signed/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: signed/app-release.apk
          if-no-files-found: error

      - name: Upload signed debug App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bundle
          path: signed/app-debug.aab
          if-no-files-found: error

      - name: Upload signed release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: signed/app-release.aab
          if-no-files-found: error

      - name: Generate tag
        id: tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Git tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ steps.tag.outputs.tag }}
          files: |
            signed/app-debug.apk
            signed/app-release.apk
            signed/app-debug.aab
            signed/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}